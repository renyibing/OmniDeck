[package]
name = "omnideck"
version = "0.1.0"
description = "OmniDeck desktop native host"
authors = ["OmniDeck"]
edition = "2021"

[lib]
name = "omnideck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.11.5", features = [] }
